{% extends "admin/base.html" %}
{% block title %}Help{% endblock %}
{% block body %}
<h1>Help</h1>
<div class="subnav">{% for label, path in sections %}<a href="{{ path }}">{{ label }}</a>{% endfor %}</div>
<form class="card" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="title">Title</label>
  <input id="title" name="title" required>
  <label for="audience">Audience</label>
  <select id="audience" name="audience"><option value="public">Public</option><option value="staff">Staff only</option></select>
  <label for="body">Body</label>
  <textarea id="body" name="body"></textarea>
  <p><button class="btn" type="submit">Save article</button></p>
</form>
{% for article in articles %}
<article class="card">
  <h2>{{ article.title }} <span class="badge">{{ article.audience }}</span></h2>
  <p>{{ article.body }}</p>
</article>
{% endfor %}
{% endblock %}
