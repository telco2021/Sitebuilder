<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password · Liquid Software</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="login">
    <form class="card" method="post" action="/admin/reset/{{ token }}">
      <h1>New password</h1>
      {% if flash %}<div class="flash {{ flash.level }}">{{ flash.message }}</div>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="confirmation">Confirm</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required>
      <p><button class="btn" type="submit">Update password</button></p>
    </form>
  </div>
</body>
</html>
