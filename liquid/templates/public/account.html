{% extends "public/base.html" %}
{% block title %}Account{% endblock %}
{% block body %}
<h1>Account</h1>
{% if customer %}
<p>Signed in as {{ customer.email }}.</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="action" value="logout">
  <button class="btn secondary" type="submit">Sign out</button>
</form>
{% else %}
<form class="card" method="post">
  <h2>Sign in</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="action" value="login">
  <label>Email</label><input name="email" type="email" required>
  <label>Password</label><input name="password" type="password" required>
  <p><button class="btn" type="submit">Sign in</button></p>
</form>
<form class="card" method="post">
  <h2>Create an account</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="action" value="register">
  <div class="row">
    <div><label>First name</label><input name="first_name"></div>
    <div><label>Last name</label><input name="last_name"></div>
  </div>
  <label>Email</label><input name="email" type="email" required>
  <label>Password</label><input name="password" type="password" required>
  <p><button class="btn" type="submit">Register</button></p>
</form>
{% endif %}
{% endblock %}
