{% extends "public/base.html" %}
{% block title %}Cancel · {{ site.name }}{% endblock %}
{% block body %}
<h1>Cancel a reservation</h1>
<form class="card" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="confirmation_code">Confirmation code</label>
  <input id="confirmation_code" name="confirmation_code" required>
  <label for="email">Email on the reservation</label>
  <input id="email" name="email" type="email" required>
  <p><button class="btn" type="submit">Cancel</button></p>
</form>
{% endblock %}
