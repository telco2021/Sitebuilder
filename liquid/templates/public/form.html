{% extends "public/base.html" %}
{% block title %}{{ form_def.name }}{% endblock %}
{% block body %}
<h1>{{ form_def.name }}</h1>
<p>{{ form_def.description }}</p>
<form class="card" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for spec in form_def.fields %}
  <label for="{{ spec.name }}">{{ spec.label }}</label>
  {% if spec.type == "textarea" %}
  <textarea id="{{ spec.name }}" name="{{ spec.name }}" {% if spec.required %}required{% endif %}></textarea>
  {% else %}
  <input id="{{ spec.name }}" name="{{ spec.name }}" {% if spec.required %}required{% endif %}>
  {% endif %}
  {% endfor %}
  <p><button class="btn" type="submit">Send</button></p>
</form>
{% endblock %}
