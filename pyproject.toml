[project]
name = "liquid-software"
version = "1.2.0"
description = "Liquid Software Sitebuilder, rewritten in Python from the legacy ASP.NET product."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "bleach>=6.1",
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
]

[project.scripts]
liquid = "liquid.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["liquid*"]
